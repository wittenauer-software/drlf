name: Software defect
description: Report a reproducible DRLF defect using synthetic inputs only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include real identities, NPIs, claims, leads, allegations, PHI, beneficiary data,
        credentials, private URLs, or retained research outputs.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-safe reproduction
      options:
        - label: This report contains only registered synthetic or non-identifying material.
          required: true
        - label: This is not a security report or healthcare fraud tip.
          required: true
  - type: input
    id: version
    attributes:
      label: DRLF version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include bounded commands, expected behavior, and actual behavior.
    validations:
      required: true
