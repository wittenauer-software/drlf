name: Generalized feature
description: Propose a public-safe DRLF capability or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Describe the general workflow. Do not include a named case, real identifier, allegation, PHI,
        beneficiary data, private evidence, or private repository lineage.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public boundary
      options:
        - label: This request contains no identifiable healthcare research material.
          required: true
        - label: I understand that a skill change requires separate maintainer approval before edits.
          required: true
  - type: textarea
    id: need
    attributes:
      label: Generalized need and expected outcome
    validations:
      required: true
