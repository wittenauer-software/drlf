[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "drlf"
version = "0.1.0"
description = "Detection, research, and governed learning for public healthcare claims"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{name = "Wittenauer Software"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.0,<3",
  "PyYAML>=6,<7",
  "truststore>=0.10,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
data = ["polars>=1,<2", "pyarrow>=18,<23"]
reporting = ["jinja2>=3.1,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
drlf = "drlf.cli:app"

[project.urls]
Repository = "https://github.com/wittenauer-software/drlf"
Issues = "https://github.com/wittenauer-software/drlf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/drlf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
