case_lifecycle:
  case_id: SYNTHETIC-CASE-ALPHA
  question: >-
    Does the aggregate attribution more plausibly represent a protocol role than individual visits?
  stages:
    - intake
    - context-review
    - analysis
    - cutoff
    - disposition
    - retrospective
    - learning-proposal
    - skill-change-proposal
  evidence:
    - evidence_id: SYNTHETIC-EVIDENCE-AGGREGATE
      kind: observed-fact
      direction: supports
      statement: One prescriber token is attributed across two dispensing locations.
    - evidence_id: SYNTHETIC-EVIDENCE-PROTOCOL
      kind: observed-fact
      direction: supports
      statement: The invented protocol record identifies a standing-order role.
    - evidence_id: SYNTHETIC-EVIDENCE-UNKNOWN
      kind: unresolved-question
      direction: weakens
      statement: The aggregate does not establish transaction-level dispensing or remittance.
  applied_foundation: SYNTHETIC-FOUNDATION-ROLE-SEPARATION
  bounded_actions:
    - action_id: SYNTHETIC-ACTION-DENOMINATOR
      question: >-
        Does the compatible national product total materially change the interpretation of the
        attributed prescriber's visible-row share?
      source: SYNTHETIC-SOURCE-METHODOLOGY
      bounds:
        max_queries: 1
        max_runtime_seconds: 10
        max_output_bytes: 2048
      distinguishing_outcomes:
        - A compatible unsuppressed national total changes the magnitude or triage lane.
        - The compatible total confirms scale but does not resolve operational actors.
      observed_outcome: >-
        The compatible total confirmed the aggregate scale but did not identify the dispenser,
        administrator, biller, or payment recipient.
      disposition_before: triage
      disposition_after: triage
      disposition_consequence: no-change; role-resolution evidence remains decisive
      changed_disposition: false
    - action_id: SYNTHETIC-ACTION-AFFILIATION
      question: >-
        Does one bounded public-directory review identify a dated protocol or dispensing
        affiliation for the attributed prescriber token?
      source: SYNTHETIC-SOURCE-PUBLIC-DIRECTORY
      bounds:
        max_queries: 2
        max_runtime_seconds: 20
        max_output_bytes: 4096
      distinguishing_outcomes:
        - A dated public record links an operational role and changes the triage lane.
        - No dated public record is found and the role question remains unresolved.
      observed_outcome: >-
        No dated protocol or dispensing affiliation appeared in the bounded invented directory;
        absence from that directory does not refute a protocol role.
      disposition_before: triage
      disposition_after: triage
      disposition_consequence: no-change; absence from a bounded public source is not disproof
      changed_disposition: false
  cutoff:
    qualifying_public_actions: []
    reason: The remaining decisive evidence is transaction-level and unavailable in this exercise.
    revisit_trigger: A synthetic transaction-level fixture with a conflicting role assignment.
  disposition: explained
  retrospective:
    outcome: A protocol role is a supported ordinary explanation in the invented scenario.
    limitation: The workflow does not validate any real transaction or provider.
  candidate_learning:
    learning_id: SYNTHETIC-LEARNING-CANDIDATE
    title: Resolve operational roles before interpreting aggregate attribution
    status: candidate
    type: process
    confidence: low
    scope:
      programs:
        - synthetic-drug-benefit
      datasets:
        - synthetic-provider-product-aggregate
      years:
        - 2099
      populations:
        - invented-benefit-enrollees
    evidence_ids:
      - SYNTHETIC-EVIDENCE-AGGREGATE
      - SYNTHETIC-EVIDENCE-PROTOCOL
      - SYNTHETIC-EVIDENCE-UNKNOWN
    lesson: Resolve operational roles before treating aggregate attribution as individual activity.
    why_it_matters: It prevents prescriber attribution from being mislabeled as visits or revenue.
    counterevidence_and_limits: The exercise cannot establish behavior in any real transaction.
    failed_approaches: Treating one aggregate prescriber token as one person's patient panel.
    reuse_guidance: Build the role matrix and effective-dated affiliation lanes before escalation.
    invalidation_triggers: A conflicting transaction-level fixture or changed source semantics.
    history:
      - Created from the completed synthetic case and retained as candidate status.
  skill_change_proposal:
    target: synthetic-protocol-workflow
    evidence: Repeated role-resolution steps in the completed synthetic lifecycle.
    behavior: Add an explicit role-matrix precondition to a future workflow revision.
    files:
      - path/to/future/instruction
    validation:
      - role-matrix contract test
    permission:
      status: not-granted
      explicit_user_approval: false
      change_applied: false

